  return (
    <div className="flex flex-wrap gap-3 items-center text-xs" style={{ fontFamily: "'Barlow Condensed', sans-serif" }}>
      {Object.entries(REL_STYLE).map(([k, s]) => (
        <div key={k} className="flex items-center gap-1.5">
          <svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke={s.color} strokeWidth={s.width} strokeDasharray={s.dash} /></svg>
          <span className="font-semibold" style={{ color: "#14151A" }}>{s.label}</span>
        </div>
      ))}
    </div>
  );
}

function WebView({ teamFilter, focusId, onFocus, onOpenDetail, query, searchMatches }) {
  const svgRef = useRef(null);
  const gRef = useRef(null);
  const zoomRef = useRef(null);

  const { nodeIds, depth, edges } = useMemo(() => getNeighborhood(focusId, 2), [focusId]);

  const layout = useMemo(() => {
    if (!nodeIds.length) return { nodes: [], links: [] };
    const nodes = nodeIds.map((id, i) => {
      const d = depth[id];
      const angle = (i / nodeIds.length) * Math.PI * 2 + d * 0.4;
      const radius = d === 0 ? 0 : d === 1 ? 150 : 300;
      const jitter = () => (Math.random() - 0.5) * 24;
      return { ...byId[id], depth: d, x: GRAPH_W / 2 + Math.cos(angle) * radius + jitter(), y: GRAPH_H / 2 + Math.sin(angle) * radius + jitter() };
    });
    const links = edges.map((r) => ({ source: r.a, target: r.b, type: r.type }));
    const sim = d3
      .forceSimulation(nodes)
      .force("link", d3.forceLink(links).id((d) => d.id).distance((l) => (l.type === "family" ? 90 : 130)).strength(0.7))
      .force("charge", d3.forceManyBody().strength(-320))
      .force("center", d3.forceCenter(GRAPH_W / 2, GRAPH_H / 2))
      .force("collide", d3.forceCollide((d) => (d.depth === 0 ? 60 : d.depth === 1 ? 50 : 42)).strength(0.95).iterations(3))
      .stop();
    for (let i = 0; i < 400; i++) sim.tick();
    return { nodes, links };
  }, [nodeIds, depth, edges]);

  // set up zoom/pan once
  useEffect(() => {
    const svg = d3.select(svgRef.current);
    const zoomB = d3.zoom().scaleExtent([0.4, 3.5]).on("zoom", (event) => {
      d3.select(gRef.current).attr("transform", event.transform);
    });
    svg.call(zoomB);
    zoomRef.current = zoomB;
    return () => svg.on(".zoom", null);
  }, []);

  const fitToContent = useCallback(() => {
    if (!layout.nodes.length || !svgRef.current || !zoomRef.current) return;
    const pad = 80;
    const xs = layout.nodes.map((n) => n.x);
    const ys = layout.nodes.map((n) => n.y);
    const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
    const minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;
    const w = Math.max(maxX - minX, 120), h = Math.max(maxY - minY, 120);
    const scale = Math.min(GRAPH_W / w, GRAPH_H / h, 2.4);
    const tx = GRAPH_W / 2 - scale * (minX + maxX) / 2;
    const ty = GRAPH_H / 2 - scale * (minY + maxY) / 2;
    d3.select(svgRef.current).transition().duration(450).call(zoomRef.current.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
  }, [layout]);

  useEffect(() => {
    fitToContent();
  }, [fitToContent]);

  const zoomBy = (factor) => {
    if (!zoomRef.current) return;
    d3.select(svgRef.current).transition().duration(200).call(zoomRef.current.scaleBy, factor);
  };

  const focusChar = focusId ? byId[focusId] : null;

  return (
    <div className="rounded-xl p-3" style={{ background: "#FBF7EE", border: "3px solid #14151A", boxShadow: "4px 4px 0 #14151A" }}>
      <div className="flex items-center justify-between mb-2 px-1 flex-wrap gap-2">
        <Legend />
        {focusChar && (
          <div className="text-xs font-bold uppercase" style={{ fontFamily: "'Barlow Condensed', sans-serif", color: "#14151A" }}>
            Centered on {focusChar.name} · 2 degrees
          </div>
        )}
      </div>

      {query && searchMatches && searchMatches.length > 0 && (
        <div className="mb-2 rounded-lg overflow-hidden" style={{ border: "2px solid #14151A" }}>
          {searchMatches.map((c) => (
            <button
              key={c.id}
              onClick={() => onFocus(c.id)}
              className="w-full text-left px-3 py-1.5 text-sm hover:bg-black/5 flex items-center justify-between"
              style={{ fontFamily: "'Barlow Condensed', sans-serif", borderBottom: "1px solid #14151A22" }}
            >
              <span className="font-semibold" style={{ color: "#14151A" }}>{c.name}</span>
              <span className="text-[10px] uppercase" style={{ color: "#6B6B6B" }}>{c.team}</span>
            </button>
          ))}
        </div>
      )}

      <div className="relative rounded-lg overflow-hidden" style={{ background: "#DED2B5" }}>
        {layout.nodes.length === 0 ? (
          <div className="flex flex-col items-center justify-center gap-3 py-16 px-4 text-center" style={{ minHeight: "40vh" }}>
            <div className="text-sm" style={{ fontFamily: "'Barlow Condensed', sans-serif", color: "#4B4B4B" }}>
              Search a name above, or open a card and tap "See relationship web," to explore two degrees of connections here.
            </div>
            <div className="flex flex-wrap gap-1.5 justify-center max-w-sm">
              {QUICK_PICKS.map((id) => (
                <button
                  key={id}
                  onClick={() => onFocus(id)}
                  className="text-[11px] font-bold uppercase px-2.5 py-1 rounded-full"
                  style={{ fontFamily: "'Barlow Condensed', sans-serif", border: "2px solid #14151A", background: "#FBF7EE", color: "#14151A" }}
                >
                  {byId[id].name}
                </button>
              ))}
            </div>
          </div>
        ) : (
          <>
            <svg
              ref={svgRef}
              viewBox={`0 0 ${GRAPH_W} ${GRAPH_H}`}
              className="w-full"
              style={{ height: "58vh", touchAction: "none", cursor: "grab" }}
            >
              <g ref={gRef}>
                {layout.links.map((l, i) => {
                  const s = REL_STYLE[l.type];
                  const aFiltered = teamFilter && l.source.team !== teamFilter;
                  const bFiltered = teamFilter && l.target.team !== teamFilter;
                  return (
                    <line
                      key={i}
                      x1={l.source.x} y1={l.source.y} x2={l.target.x} y2={l.target.y}
                      stroke={s.color} strokeWidth={s.width} strokeDasharray={s.dash}
                      opacity={aFiltered || bFiltered ? 0.15 : 0.85}
                    />
                  );
                })}
                {layout.nodes.map((n) => {
                  const team = TEAMS[n.team];
                  const r = n.depth === 0 ? 32 : n.depth === 1 ? 24 : 18;
                  const dim = teamFilter && n.team !== teamFilter;
                  return (
                    <g key={n.id} opacity={dim ? 0.3 : 1} style={{ cursor: "pointer" }} onClick={() => (n.id === focusId ? onOpenDetail(n.id) : onFocus(n.id))}>
                      <circle
                        cx={n.x} cy={n.y} r={r}
                        fill={team.color}
                        stroke={n.depth === 0 ? "#F0B429" : "#14151A"}
                        strokeWidth={n.depth === 0 ? 4 : 2}
                      />
                      <text x={n.x} y={n.y + 4} textAnchor="middle" fontSize={n.depth === 0 ? 13 : 10} fontWeight={800} fill="#fff" style={{ fontFamily: "'Barlow Condensed', sans-serif" }}>
                        {initialsOf(n.name)}
                      </text>
                      <text x={n.x} y={n.y + r + 14} textAnchor="middle" fontSize={n.depth === 0 ? 13 : 11} fontWeight={700} fill="#14151A" style={{ fontFamily: "'Barlow Condensed', sans-serif" }}>
                        {n.name}
                      </text>
                    </g>
                  );
                })}
              </g>
            </svg>
            <div className="absolute top-2 right-2 flex flex-col gap-1 rounded-lg overflow-hidden" style={{ border: "2px solid #14151A", background: "#FBF7EE" }}>
              <button onClick={() => zoomBy(1.4)} className="p-1.5 hover:bg-black/5" title="Zoom in"><ZoomIn size={15} /></button>
              <button onClick={() => zoomBy(1 / 1.4)} className="p-1.5 hover:bg-black/5 border-t" style={{ borderColor: "#14151A22" }} title="Zoom out"><ZoomOut size={15} /></button>
              <button onClick={fitToContent} className="p-1.5 hover:bg-black/5 border-t" style={{ borderColor: "#14151A22" }} title="Fit to view"><Maximize2 size={15} /></button>
            </div>
          </>
        )}
      </div>
      <div className="text-xs text-center mt-2" style={{ fontFamily: "'Barlow Condensed', sans-serif", color: "#6B6B6B" }}>
        Tap a ring node to re-center on it, or the middle node to open its full profile. Pinch or scroll to zoom, drag to pan.
      </div>
    </div>
  );
}

function MarvelDeck() {
  const [query, setQuery] = useState("");
  const [teamFilter, setTeamFilter] = useState(null);
  const [view, setView] = useState("cards"); // cards | web
  const [selectedId, setSelectedId] = useState(null);
  const [focusId, setFocusId] = useState(null);

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return CHARACTERS.filter((c) => {
      const matchesQuery =
        !q ||
        c.name.toLowerCase().includes(q) ||
        c.real.toLowerCase().includes(q) ||
        c.team.toLowerCase().includes(q) ||
        c.powers.some((p) => p.toLowerCase().includes(q));
      const matchesTeam = !teamFilter || c.team === teamFilter;
      return matchesQuery && matchesTeam;
    });
  }, [query, teamFilter]);

  const searchMatches = useMemo(() => filtered.slice(0, 6), [filtered]);

  const viewInWeb = (id) => {
    setFocusId(id);
    setView("web");
    setSelectedId(null);
  };

  return (
    <div className="min-h-screen w-full" style={{ background: "#EFE7D6" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Condensed:wght@400;600;700;800&display=swap');
      `}</style>

      <div
        className="px-4 pt-6 pb-4"
        style={{
          backgroundImage: "radial-gradient(#14151A14 1px, transparent 1.3px)",
          backgroundSize: "10px 10px",
          borderBottom: "4px solid #14151A",
        }}
      >
        <div className="max-w-5xl mx-auto">
          <div className="flex items-center gap-2 mb-1">
            <div className="px-2 py-0.5 rounded" style={{ background: "#DC2626", transform: "rotate(-2deg)" }}>
              <span className="text-white text-[11px] font-bold uppercase tracking-wider" style={{ fontFamily: "'Barlow Condensed', sans-serif" }}>
                Field File
              </span>
            </div>
          </div>
          <h1 className="font-black uppercase leading-none" style={{ fontFamily: "'Bangers', cursive", fontSize: 44, color: "#14151A", letterSpacing: 1 }}>
            The Connected Universe
          </h1>
          <p className="text-sm mt-1 max-w-xl" style={{ fontFamily: "'Barlow Condensed', sans-serif", color: "#4B4B4B" }}>
            A browsable dossier of characters — search the deck, or switch to the web view to trace a character's family, teammates, and rivals two degrees out.
          </p>
        </div>
      </div>

      <div className="max-w-5xl mx-auto px-4 py-4">
        <div className="flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between mb-4">
          <div className="flex items-center gap-2 flex-1">
            <div className="relative flex-1 max-w-xs">
              <Search size={16} className="absolute left-2.5 top-1/2 -translate-y-1/2" style={{ color: "#6B6B6B" }} />
              <input
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="Search name, power, team…"
                className="w-full pl-8 pr-3 py-2 rounded-lg text-sm outline-none"
                style={{ border: "2px solid #14151A", fontFamily: "'Barlow Condensed', sans-serif", background: "#FBF7EE" }}
              />
            </div>
            <div className="flex gap-1 rounded-lg p-1" style={{ border: "2px solid #14151A", background: "#FBF7EE" }}>
              <button
                onClick={() => setView("cards")}
                className="p-1.5 rounded"
                style={{ background: view === "cards" ? "#14151A" : "transparent", color: view === "cards" ? "#FBF7EE" : "#14151A" }}
                title="Card grid"
              >
                <LayoutGrid size={16} />
              </button>
              <button
                onClick={() => setView("web")}
                className="p-1.5 rounded"
                style={{ background: view === "web" ? "#14151A" : "transparent", color: view === "web" ? "#FBF7EE" : "#14151A" }}
                title="Relationship web"
              >
                <Network size={16} />
              </button>
            </div>
          </div>

          <div className="flex flex-wrap gap-1.5">
            <button
              onClick={() => setTeamFilter(null)}
              className="text-[11px] font-bold uppercase px-2.5 py-1 rounded-full"
              style={{
                fontFamily: "'Barlow Condensed', sans-serif",
                border: "2px solid #14151A",
                background: teamFilter === null ? "#14151A" : "#FBF7EE",
                color: teamFilter === null ? "#FBF7EE" : "#14151A",
              }}
            >
              All
            </button>
            {Object.entries(TEAMS).map(([name, t]) => (
              <button
                key={name}
                onClick={() => setTeamFilter(teamFilter === name ? null : name)}
                className="text-[11px] font-bold uppercase px-2.5 py-1 rounded-full"
                style={{
                  fontFamily: "'Barlow Condensed', sans-serif",
                  border: "2px solid #14151A",
                  background: teamFilter === name ? t.color : "#FBF7EE",
                  color: teamFilter === name ? "#fff" : "#14151A",
                }}
              >
                {name}
              </button>
            ))}
          </div>
        </div>

        {view === "cards" ? (
          <div className="grid gap-4" style={{ gridTemplateColumns: "repeat(auto-fill, minmax(230px, 1fr))" }}>
            {filtered.map((c) => (
              <Card key={c.id} char={c} onSelect={setSelectedId} />
            ))}
            {filtered.length === 0 && (
              <div className="col-span-full text-center py-10 text-sm" style={{ fontFamily: "'Barlow Condensed', sans-serif", color: "#6B6B6B" }}>
                No one in the file matches that search.
              </div>
            )}
          </div>
        ) : (
          <WebView
            teamFilter={teamFilter}
            focusId={focusId}
            onFocus={setFocusId}
            onOpenDetail={setSelectedId}
            query={query}
            searchMatches={searchMatches}
          />
        )}
      </div>

      <DetailPanel id={selectedId} onClose={() => setSelectedId(null)} onJump={setSelectedId} onViewWeb={viewInWeb} />
    </div>
  );
}

ReactDOM.createRoot(rootEl).render(<MarvelDeck />);
