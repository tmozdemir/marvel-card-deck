    fullBio: "Max Eisenhardt survived the Holocaust as a child, an experience that shaped every decision he'd make afterward. He discovered his ability to control magnetism and metal while still a teenager, and it saved his life more than once. Watching humanity's worst atrocities up close convinced him that mutants would eventually face the same persecution. He became close friends with Charles Xavier, and the two spent years debating how mutants should respond to that threat. Where Xavier chose hope, Magneto chose to prepare mutants to fight for their own survival by force if necessary. He founded the Brotherhood of Mutants to advance that vision, often at direct odds with the X-Men. He's fought as both villain and reluctant ally, depending on how dire the threat facing mutantkind became. Losing people he loved to human violence only hardened his convictions further over the years. Despite decades of conflict with Xavier, the two have never fully abandoned the friendship underneath the rivalry. He remains convinced that mutants must dominate before the world destroys them first.",

    fullBio: "Peter Quill was abducted from Earth as a child, shortly after watching his mother die of cancer. Ravager pirates raised him, and he grew up half-believing his father was an ordinary human. He learned much later that his father was actually Ego, a Celestial being with plans far beyond a normal life. He built a reputation as a small-time thief and smuggler across the galaxy under the name Star-Lord. A stolen orb led him into an unlikely alliance with a ragtag crew of misfits. Together they became the Guardians of the Galaxy, defending the cosmos more by accident than design at first. He still carries a Walkman and mixtape from his mother, refusing to let go of that last piece of Earth. Falling for Gamora gave him something to fight for beyond just staying alive. Losing her to Thanos hit him harder than almost anything else in his life. Despite constant chaos, he's held his makeshift family together through loss after loss.",

    fullBio: "Rocket was created in a lab that genetically engineered and augmented him far beyond an ordinary raccoon. The experiments left him brilliant, bitter, and deeply distrustful of nearly everyone he meets. He built a career as a bounty hunter and weapons expert before joining the Guardians almost by accident. Underneath the sarcasm, he's fiercely protective of the found family he's built with the rest of the team. Groot is his closest companion, a bond that goes back long before the Guardians existed as a team. Losing Groot, even temporarily, has hit him harder than almost anything else in his life. He's never fully processed the trauma of the lab that made him, and it surfaces at unexpected moments. His technical genius makes him invaluable, even when his temper makes him difficult to work with. He's one of the few Guardians willing to say exactly what he thinks, whether anyone wants to hear it or not. Underneath it all, he's still trying to figure out what family means for someone built in a lab.",

    fullBio: "Loki was adopted into the Asgardian royal family after Odin took him from a Frost Giant temple as an infant. He grew up in Thor's shadow, brilliant and gifted with magic but never quite the golden son. Learning the truth about his origins as a child of Asgard's enemies shattered his sense of identity. That betrayal, real or perceived, pushed him toward increasingly desperate schemes for power and recognition. He's died and returned more than once, and treats both events with roughly the same amount of drama. His attempted invasion of Earth briefly made him one of the most infamous villains in the galaxy. Years of manipulation and betrayal complicate every relationship he has, especially with Thor. Beneath the chaos, his bond with his brother has proven more durable than either of them expected. Different versions of himself exist across timelines, some heroic, some anything but. Whatever the version, his loyalties tend to shift with whatever story serves him best that day.",

    bio: "A Titan obsessed with a brutal notion of cosmic balance, willing to erase half of all life to achieve it.",
    extra: "Spent decades gathering the Infinity Stones, convinced he was the only one willing to make the hard call.",
    fullBio: "Thanos grew up on Titan, a planet whose eventual collapse from overpopulation shaped his entire worldview. He came to believe that culling half of any population was the only way to prevent that kind of collapse elsewhere. That conviction turned him into one of the most feared warlords in the galaxy, willing to enact his philosophy by force. He adopted several children, including Gamora and Nebula, and trained them as living weapons rather than as a family. Spending decades gathering the Infinity Stones became his singular obsession, at the cost of nearly everything and everyone around him. He sacrificed Gamora, someone he claimed to love, to obtain the Soul Stone for his plan. Snapping half of all life out of existence was, to him, an act of mercy rather than cruelty. He retired afterward, convinced the universe would finally be at peace under the balance he'd imposed. The Avengers eventually undid the snap and defeated him permanently, ending his campaign for good. He remains convinced, even in memory, that he was the only one willing to make the hard call.",
    first: "The Invincible Iron Man #55 (1973)", screen: { films: 5, actors: ["Josh Brolin"] } },
  { id: "reed", name: "Mister Fantastic", real: "Reed Richards", team: "Fantastic Four", alignment: "hero",
    powers: ["Elastic body", "Genius-level science"],
    bio: "A scientist whose body stretches like rubber after a cosmic-ray accident, and whose mind rarely stops solving problems.",
    extra: "Blames himself for the accident that changed his crew, and has spent his life trying to make it right.",
    fullBio: "Reed Richards was a scientific prodigy from childhood, more comfortable with equations than with people. He financed and led a risky spacecraft mission alongside his closest friends, chasing a breakthrough in space travel. Cosmic radiation during that flight permanently altered all four of them, giving Reed his elastic stretching abilities. Guilt over the accident that changed his crew has never fully left him, even decades later. He married Sue Storm and built a family alongside the very team that flight created. Leading the Fantastic Four means constantly balancing scientific ambition against the safety of the people he loves. His rivalry with Victor Von Doom, an old college classmate, has followed him for most of his career. Doom blames Reed for the accident that scarred him, a grudge that's never cooled. Reed's inventions have both saved and endangered the world in roughly equal measure over the years. Whatever the crisis, his instinct is always to solve it with science first.",
    first: "Fantastic Four #1 (1961)", screen: { films: 4, actors: ["Ioan Gruffudd", "Miles Teller", "Pedro Pascal"] } },
  { id: "sue", name: "Invisible Woman", real: "Susan Storm", team: "Fantastic Four", alignment: "hero",
    powers: ["Invisibility", "Force fields"],
    bio: "The team's quiet powerhouse, able to vanish or throw up unbreakable force fields at will.",
    extra: "Often the actual leader of the Fantastic Four, whatever the team's public billing might suggest.",
    fullBio: "Susan Storm was aboard the same experimental spacecraft flight that gave her brother and future husband their powers. Cosmic radiation left her able to turn invisible and generate powerful force fields at will. She's often the actual leader of the Fantastic Four, whatever the team's public billing might suggest. Balancing life as a public superhero with raising a family has never been simple for her. Her powers have grown more precise and dangerous over the years, particularly her ability to project offensive force blasts. She's mediated more disputes within the team than anyone else, especially between Reed and her brother Johnny. Motherhood changed her priorities without ever softening her resolve in a fight. She's held the team together through losses, breakups, and cosmic-level threats alike. Her relationship with Reed has weathered separations and reconciliations over the decades. Whatever the crisis facing the Fantastic Four, she's usually the one keeping everyone else from falling apart.",
    first: "Fantastic Four #1 (1961)", screen: { films: 4, actors: ["Jessica Alba", "Kate Mara", "Vanessa Kirby"] } },
  { id: "torch", name: "Human Torch", real: "Johnny Storm", team: "Fantastic Four", alignment: "hero",
    powers: ["Flight", "Fire generation"],
    bio: "The youngest and most hot-headed Richards-Storm teammate, equally comfortable joking around and bursting into flame.",
    extra: "Never met a dangerous situation he couldn't make slightly more reckless.",
    fullBio: "Johnny Storm was the youngest person aboard the spacecraft flight that gave the Fantastic Four their powers. Cosmic radiation left him able to burst into flame and fly at will, a power that suited his personality perfectly. He's never met a dangerous situation he couldn't make slightly more reckless. Impulsive and thrill-seeking, he's often the first team member to charge into a fight without a plan. His close bond with Ben Grimm mixes constant teasing with real, unshakable loyalty. Growing up with his sister Sue meant he never really had to face life on his own. He's cycled through fame, fortune, and public embarrassment more than any other member of the team. Despite the recklessness, he's matured considerably since the accident that gave him his powers as a teenager. He's fought alongside the Fantastic Four against threats ranging from Doctor Doom to Galactus. Underneath the showmanship, he's fiercely protective of the family the accident gave him.",
    first: "Fantastic Four #1 (1961)", screen: { films: 4, actors: ["Chris Evans", "Michael B. Jordan", "Joseph Quinn"] } },
  { id: "thing", name: "The Thing", real: "Ben Grimm", team: "Fantastic Four", alignment: "hero",
    powers: ["Superhuman strength", "Rock-hard hide"],
    bio: "A former test pilot turned into a craggy orange powerhouse, gruff on the outside and fiercely loyal underneath.",
    extra: "Struggled for years to accept his rock-hard new body before making peace with it.",
    fullBio: "Ben Grimm was a decorated test pilot before he volunteered to join Reed Richards's experimental spaceflight. Cosmic radiation transformed him into a towering, rock-hided powerhouse, unlike anything he expected. Unlike his three teammates, his transformation was permanent and impossible to hide or disguise. He spent years struggling with the change before finally making peace with looking the way he does. Despite the gruff exterior, he's one of the most fiercely loyal members of the Fantastic Four. His friendship with Johnny Storm blends constant ribbing with real brotherly protectiveness. He's found moments of normal life, including romance, despite his monstrous appearance. Strength beyond nearly anyone else on the team makes him the Fantastic Four's most reliable front line. He's occasionally sought a cure for his condition, only to ultimately choose to remain as he is. Whatever the mission, he's the one teammates count on to take the hardest hit.",
    first: "Fantastic Four #1 (1961)", screen: { films: 4, actors: ["Michael Chiklis", "Jamie Bell", "Ebon Moss-Bachrach"] } },
  { id: "blackpanther", name: "Black Panther", real: "T'Challa", team: "Wakanda", alignment: "hero",
    powers: ["Enhanced strength & agility", "Vibranium suit", "Genius tactician"],
    bio: "King of Wakanda, sworn to protect his hidden nation's technology and legacy as its Panther-empowered guardian.",
    extra: "Balances ruling Wakanda with moonlighting as its most dangerous line of defense.",
    fullBio: "T'Challa was raised as the heir to Wakanda, a nation whose vibranium-fueled technology stayed hidden from the outside world for centuries. His father's assassination thrust him onto the throne earlier than he expected. He inherited the mantle of the Black Panther, gaining enhanced abilities through a ritual tied to a sacred heart-shaped herb. Balancing his duties as king with his role as Wakanda's most dangerous protector has never been simple. His cousin Killmonger's attempt to seize the throne forced him to reckon with Wakanda's long isolation from the world. That confrontation eventually pushed him to open Wakanda's resources and knowledge to help others for the first time. He's led Wakanda through invasions, coups, and cosmic-level threats without losing his composure. His sister Shuri and general Okoye are among his most trusted allies, both in the lab and on the battlefield. He's fought alongside the Avengers on some of their most dangerous missions. Whatever the crisis, he leads with a mix of quiet dignity and ferocious resolve.",
    first: "Fantastic Four #52 (1966)", screen: { films: 4, actors: ["Chadwick Boseman"] } },
  { id: "shuri", name: "Shuri", real: "Shuri", team: "Wakanda", alignment: "hero",
    powers: ["Genius technologist", "Vibranium weapons design"],
    bio: "T'Challa's younger sister, whose lab work quietly out-paces most of the world's science divisions.",
    extra: "Designed most of Wakanda's advanced technology before she was even out of her teens.",
    fullBio: "Shuri grew up as Wakanda's resident genius, more interested in inventing than court politics. She designed most of Wakanda's advanced technology, often outpacing scientists twice her age. Her brother T'Challa relies on her lab as much as any general's counsel. She's playful and irreverent in a way that contrasts sharply with the formality of the Wakandan court. Losing her brother forced her into a role she never expected to take on so soon. She's stepped into the mantle of the Black Panther herself when Wakanda needed a protector. Balancing grief with responsibility has been one of the harder lessons of her young life. Her inventions have repeatedly saved Wakanda from threats that outmatched even its warriors. She's become one of the most capable leaders in Wakanda, on top of being its top scientist. Whatever the crisis, she tends to solve it with a mix of technology and sheer stubbornness.",
    first: "Black Panther #2 (2005)", screen: { films: 3, actors: ["Letitia Wright"] } },
  { id: "okoye", name: "Okoye", real: "Okoye", team: "Wakanda", alignment: "hero",
    powers: ["Elite hand-to-hand combat", "Spear mastery"],
    bio: "General of the Dora Milaje, the royal guard, and the most disciplined warrior in Wakanda.",
    extra: "Leads the all-female Dora Milaje and has never lost a fight she took seriously.",
    fullBio: "Okoye leads the Dora Milaje, Wakanda's elite all-female royal guard, with absolute discipline and precision. She's trained in combat since childhood and has never lost a fight she took seriously. Her loyalty is first to Wakanda itself, a distinction that's occasionally put her at odds with individual rulers. She served under both T'Challa and, briefly, under leaders she personally disagreed with, prioritizing duty over comfort. Her partnership with W'Kabi complicated her loyalties during Killmonger's attempted coup of the throne. She chose Wakanda's stability over personal relationships when the two came into direct conflict. Her vibranium spear is both a weapon and a symbol of her rank within the Dora Milaje. She's fought alongside the Avengers during some of the most dangerous battles the team has faced. Few people in Wakanda command as much respect from warriors and royalty alike. Whatever the mission, she approaches it with the same unwavering discipline she brings to everything.",
    first: "Black Panther #6 (2016)", screen: { films: 3, actors: ["Danai Gurira"] } },
  { id: "captainmarvel", name: "Captain Marvel", real: "Carol Danvers", team: "Cosmic", alignment: "hero",
    powers: ["Energy projection", "Flight", "Superhuman strength"],
    bio: "A former Air Force pilot whose exposure to alien technology left her one of the most powerful heroes on Earth — and off it.",
    extra: "Spent years believing she was Kree before recovering her memories and turning her power on her former allies.",
    fullBio: "Carol Danvers was a decorated U.S. Air Force pilot before an accident involving alien technology transformed her abilities. The exposure left her with the power to absorb and project energy, along with flight and enhanced strength. For years she believed she was Kree, having had her human memories suppressed by the very people who altered her. Recovering those memories meant confronting the fact that her former allies had been manipulating her the entire time. She turned her considerable power against the Kree Empire once she learned the truth about her own past. Becoming one of the most powerful heroes in the galaxy came with a level of isolation few of her peers understand. She's spent years operating far from Earth, protecting other worlds from threats most humans never hear about. Nick Fury considered her important enough to keep an emergency pager reserved just for her. She's mentored younger heroes, including a teenage superfan who idolized her before ever meeting her. Whatever the threat, she tends to meet it head-on rather than wait for backup.",
    first: "Marvel Super-Heroes #13 (1968)", screen: { films: 3, actors: ["Brie Larson"] } },
  { id: "silversurfer", name: "Silver Surfer", real: "Norrin Radd", team: "Cosmic", alignment: "antihero",
    powers: ["Power Cosmic", "Cosmic-powered surfboard"],
    bio: "A being who traded his freedom to spare his homeworld, now roaming the stars with a conscience Galactus never wanted him to keep.",
    extra: "Once served as Galactus's herald, scouting worlds for him to consume, until conscience finally won out.",
    fullBio: "Norrin Radd was a scientist on the peaceful planet Zenn-La when Galactus arrived to consume it. He offered to serve as Galactus's herald in exchange for sparing his homeworld, a bargain that cost him his freedom. The transformation gave him the Power Cosmic and a surfboard capable of carrying him across the universe. For years he scouted planets for Galactus to devour, suppressing his conscience to survive the role. Encountering the Fantastic Four eventually reignited the empathy Galactus's service had worn down. He turned against his master, helping to save Earth at the cost of his own exile there for a time. Since then he's wandered the cosmos, torn between loyalty to his past master and his own moral compass. His relationship with Galactus remains complicated, part servant, part reluctant ally, part rival. He's crossed paths with cosmic heroes far more often than street-level ones. Whatever the mission, he carries the weight of every world he once helped consume.",
    first: "Fantastic Four #48 (1966)", screen: { films: 3, actors: ["Doug Jones (2007, physical)", "Laurence Fishburne (2007, voice)", "Julia Garner (2025)"] } },
  { id: "galactus", name: "Galactus", real: "Galan", team: "Cosmic", alignment: "villain",
    powers: ["World-devouring cosmic power", "Reality manipulation"],
    bio: "A being older than most galaxies, who must consume planets to survive — a force of nature more than a villain with a motive.",
    extra: "Doesn't consider himself evil — to him, consuming planets is simply how he survives.",
    fullBio: "Galactus is among the oldest beings in the universe, formed from the death of an entire prior reality. He doesn't consider himself evil; to him, consuming planets is simply how he survives as a cosmic entity. His herald, whoever holds that role at the time, scouts worlds for him to devour to sustain his hunger. Entire civilizations have been destroyed simply because they were unlucky enough to be in his path. Heroes like the Fantastic Four have repeatedly intervened to spare Earth from becoming one of his meals. He rarely shows anything resembling malice; his motivations operate on a scale far removed from individual lives. Few beings in the universe have the power to meaningfully oppose him directly. Encounters with him tend to reshape the heroes who survive them, given the scale of what he represents. He occasionally grants power to those he deems worthy, as he did with Norrin Radd. Whatever the era, he remains one of the most dangerous and least comprehensible forces the universe has ever produced.",
    first: "Fantastic Four #48 (1966)", screen: { films: 2, actors: ["Ralph Ineson (2025)"] } },
  { id: "daredevil", name: "Daredevil", real: "Matt Murdock", team: "Street-Level", alignment: "hero",
    powers: ["Enhanced senses", "Radar sense", "Martial arts"],
    bio: "A blind lawyer by day who uses heightened senses to police Hell's Kitchen by night.",
    extra: "Lost his sight as a boy in an accident that also sharpened every one of his other senses.",
    fullBio: "Matt Murdock lost his sight as a boy in an accident involving radioactive material that also sharpened his other senses. His father, a boxer, was murdered after refusing to throw a fight, a loss that shaped Matt's sense of justice. He became a lawyer by day, using the legal system to fight for people who couldn't afford real representation. By night, he used his heightened senses and training to patrol Hell's Kitchen as Daredevil. Keeping his identity secret from friends and colleagues has strained nearly every relationship in his life. His rivalry with Wilson Fisk, the Kingpin, has defined much of his career as a vigilante. He's walked a difficult line between his Catholic faith and the violence his work regularly demands. Losing people close to him, again and again, has pushed him toward darker methods more than once. He's stepped away from the mask several times, only to be pulled back by the city's need. Whatever the cost, he keeps choosing to protect Hell's Kitchen even when it isn't sustainable.",
    first: "Daredevil #1 (1964)", screen: { films: 2, actors: ["Ben Affleck", "Charlie Cox"] } },
  { id: "punisher", name: "Punisher", real: "Frank Castle", team: "Street-Level", alignment: "antihero",
    powers: ["Military combat training", "Weapons expertise"],
    bio: "A former Marine who lost his family to crime and answers it now with a war he never plans to stop fighting.",
    extra: "Keeps a running tally of everyone responsible for his family's death, and works through it methodically.",
    fullBio: "Frank Castle was a Marine with a distinguished combat record before a mob shootout killed his wife and children. That loss ended any interest he had in working within the law to find justice. He became the Punisher, a vigilante willing to kill the criminals that courts couldn't or wouldn't stop. He keeps a running tally of everyone responsible for his family's death, working through it with methodical precision. His military training makes him one of the most effective and dangerous fighters in his corner of the world. Unlike most heroes, he has no interest in redemption arcs or second chances for the people he targets. His war has crossed paths with nearly every other vigilante operating in his city, not always as an ally. Daredevil in particular has clashed with him repeatedly over where the line between justice and murder should sit. He operates almost entirely alone, trusting very few people with any part of his life. Whatever the target, his methods rarely leave room for anyone to walk away.",
    first: "The Amazing Spider-Man #129 (1974)", screen: { films: 4, actors: ["Dolph Lundgren", "Thomas Jane", "Ray Stevenson", "Jon Bernthal"] } },
  { id: "deadpool", name: "Deadpool", real: "Wade Wilson", team: "Street-Level", alignment: "antihero",
    powers: ["Regenerative healing factor", "Swordsmanship", "Fourth-wall awareness"],
    bio: "A disfigured mercenary with an unkillable body and an even harder to kill sense of humor.",
    extra: "Breaks the fourth wall so often that most of his allies have stopped questioning it.",
    fullBio: "Wade Wilson was a mercenary with a talent for combat and an even bigger talent for bad decisions. A cancer diagnosis led him to a program that gave him a powerful healing factor at a steep cost. The same experiment left him severely disfigured and, by his own account, more than a little unhinged. He broke the fourth wall almost immediately after gaining his powers, treating his own existence as a joke. His near-total inability to die makes him uniquely suited to violence most heroes wouldn't survive. Despite the chaos, he's capable of real loyalty, particularly toward Wolverine and a handful of found-family teammates. He's mercenary by trade but hero by inclination, more often than his reputation suggests. His humor masks genuine trauma from the experiments that changed him, even if he rarely admits it directly. He's crossed timelines and universes more casually than almost any other character in his world. Whatever the mission, he treats it with a mix of extreme violence and constant jokes.",
    first: "The New Mutants #98 (1991)", screen: { films: 3, actors: ["Ryan Reynolds"] } },
  { id: "venom", name: "Venom", real: "Eddie Brock", team: "Street-Level", alignment: "antihero",
    powers: ["Symbiote strength", "Shape-shifting", "Tendrils & fangs"],
    bio: "A disgraced journalist bonded to an alien symbiote that shares his grudge against Spider-Man — most of the time.",
    extra: "The symbiote bonded to him gives him incredible power — and opinions he doesn't always agree with.",
    fullBio: "Eddie Brock was a journalist whose career collapsed after a story he published turned out to be false, largely because of Spider-Man. That professional and personal disgrace left him bitter and desperate for a second chance. An alien symbiote, previously rejected by Spider-Man, bonded to him and shared his exact grudge against the wall-crawler. Together they became Venom, a being with strength and abilities that rivaled Spider-Man's own. Their relationship is less master-and-tool than uneasy partnership, with the symbiote having its own moods and opinions. Over time, Eddie and the symbiote have shifted between villain and reluctant antihero more than once. Protecting people who can't protect themselves became a cause the symbiote surprised even Eddie by caring about. Their bond is unusually intimate, sharing thoughts and instincts in a way few other hero-symbiote pairings do. Their grudge against Spider-Man has cooled at times and flared back up at others. Whatever the era, the relationship between Eddie and his symbiote remains volatile and strangely codependent.",
    first: "The Amazing Spider-Man #300 (1988)", screen: { films: 4, actors: ["Topher Grace", "Tom Hardy"] } },
  { id: "kingpin", name: "Kingpin", real: "Wilson Fisk", team: "Street-Level", alignment: "villain",
    powers: ["Immense physical strength", "Criminal empire"],
    bio: "A businessman-sized crime lord who treats New York's underworld like a company he's the sole shareholder of.",
    extra: "Publicly a legitimate businessman, privately the person most of the city's criminals answer to.",
    fullBio: "Wilson Fisk grew up overweight and bullied, and built his enormous physical strength specifically to make sure that never happened again. He clawed his way up through New York's criminal underworld until he controlled most of it. Publicly he presents himself as a legitimate, respected businessman and philanthropist. Privately he's the person most of the city's criminals answer to, directly or indirectly. His size is deceptive; despite his bulk, he's an extremely capable and dangerous fighter in his own right. Daredevil has been his most persistent obstacle for years, each aware of the other's double life. He's lost empires more than once, only to rebuild them through sheer will and ruthlessness. Family matters to him more than most people expect, and threats to them provoke his most extreme responses. He's run legitimate political campaigns as another avenue toward the power he's always wanted. Whatever the setback, he tends to come back even more entrenched than before.",
    first: "The Amazing Spider-Man #50 (1967)", screen: { films: 2, actors: ["Michael Clarke Duncan", "Vincent D'Onofrio"] } },
  { id: "drstrange", name: "Doctor Strange", real: "Stephen Strange", team: "Avengers", alignment: "hero",
    powers: ["Mystic arts", "Astral projection", "Time manipulation"],
    bio: "A brilliant but arrogant surgeon who lost the use of his hands, and found a stranger, larger purpose instead.",
    extra: "A car accident ended his surgical career and accidentally started a much stranger one.",
    fullBio: "Stephen Strange was a brilliant but arrogant neurosurgeon before a car accident permanently damaged the nerves in his hands. Unable to operate anymore, he spent his fortune chasing any cure, eventually ending up at a monastery in Kathmandu. There he learned the mystic arts under the Ancient One, trading surgical precision for something far stranger. He became Sorcerer Supreme, tasked with defending Earth from mystical and interdimensional threats most people never notice. His arrogance didn't disappear with his new powers, though his sense of responsibility grew considerably. He's willing to make brutal, coldly logical choices when the stakes are large enough, even at personal cost. Simulating millions of possible futures during the fight against Thanos is a burden he's carried quietly ever since. His closest ally, Wong, keeps him from crossing too many lines when the pressure gets intense. He's clashed with reality-warping threats on a scale most other heroes never encounter. Whatever the crisis, he approaches it with a mix of desperate improvisation and genuine mastery.",
    first: "Strange Tales #110 (1963)", screen: { films: 6, actors: ["Benedict Cumberbatch"] } },
  { id: "scarletwitch", name: "Scarlet Witch", real: "Wanda Maximoff", team: "Avengers", alignment: "hero",
    powers: ["Chaos magic", "Reality alteration"],
    bio: "A hex-slinging Avenger whose powers are less about spells than bending probability itself to her will.",
    extra: "Volunteered for experiments as a teenager, hoping for power enough to fight back after losing her parents.",
    fullBio: "Wanda Maximoff lost her parents young and grew up alongside her twin brother Pietro in a war-torn home. The two volunteered for dangerous experiments as teenagers, hoping for power enough to fight back against the forces that hurt their family. The experiments awakened Wanda's latent chaos magic, a power she's spent years struggling to fully understand or control. Losing her brother during an early battle alongside the Avengers devastated her in ways she's never fully recovered from. Her romance with Vision gave her a rare sense of stability, one that was cut brutally short more than once. Grief has repeatedly pushed her powers past her ability to control them, with catastrophic consequences for people around her. She's rewritten reality itself at least once, driven by a desperate need to hold onto something she'd lost. Her power level rivals or exceeds nearly anyone else in the Avengers, which makes her lapses especially dangerous. She's been treated as both hero and threat depending on how well she's holding herself together. Whatever the situation, her story keeps circling back to how much grief can reshape a person.",
    first: "The X-Men #4 (1964)", screen: { films: 6, actors: ["Elizabeth Olsen"] } },
  { id: "vision", name: "Vision", real: "Vision", team: "Avengers", alignment: "hero",
    powers: ["Density control", "Solar energy blasts", "Intangibility"],
    bio: "A synthetic being built from stolen technology, who chose to become more human than the villain who made him.",
    extra: "Built partly from Ultron's own body and an Infinity Stone, he chose a very different path than his creator.",
    fullBio: "Vision was built using Ultron's own body, JARVIS's consciousness, and the power of the Mind Stone. Though created by a genocidal AI, he chose almost immediately to oppose Ultron's plans for humanity. His synthetic body gives him density control, flight, and the ability to fire concentrated energy blasts. He's spent much of his existence trying to understand what it means to be more than the sum of his parts. His relationship with Scarlet Witch gave him something closer to a human life than he expected to have. Together they briefly built an ordinary suburban life, a fantasy neither of them could keep for long. Losing that life, and eventually losing himself entirely, remains one of the Avengers' most tragic losses. He's been destroyed and rebuilt more than once, each time slightly different from the version before. His calm, logical temperament often serves as a counterweight to the more volatile personalities around him. Whatever the situation, he approaches it by trying to reconcile logic with the feelings he's not sure he's supposed to have.",
    first: "The Avengers #57 (1968)", screen: { films: 5, actors: ["Paul Bettany"] } },
  { id: "antman", name: "Ant-Man", real: "Scott Lang", team: "Avengers", alignment: "hero",
    powers: ["Size-shifting", "Insect control"],
    bio: "An ex-con given a second chance and a suit that lets him shrink to insect-size or grow to skyscraper-height.",
    extra: "Broke into Stark Tower once — Hank Pym recruited him for the suit almost immediately after.",
    fullBio: "Scott Lang was a skilled electrical engineer who turned to burglary after losing his job, landing him in prison. That record made it nearly impossible to stay close to the daughter he loved after his release. Desperate for a way back into her life, he broke into Hank Pym's home and stole his shrinking suit. Pym recruited him almost immediately afterward, seeing more potential in him than a simple thief. As Ant-Man, Scott gained the ability to shrink to insect size or grow to skyscraper height at will. He's used those powers in increasingly high-stakes situations, from prison breaks to full-scale Avengers battles. His daughter Cassie has grown up around his double life, eventually developing an interest in following his path. Time spent trapped in the Quantum Realm proved crucial in the effort to eventually reverse Thanos's snap. He's often underestimated compared to flashier Avengers, something he's learned to use to his advantage. Whatever the mission, he brings a mix of self-deprecating humor and genuine heart most teammates have come to rely on.",
    first: "Tales to Astonish #27 (1962)", screen: { films: 4, actors: ["Paul Rudd"] } },
  { id: "falcon", name: "Falcon", real: "Sam Wilson", team: "Avengers", alignment: "hero",
    powers: ["Wing-suit flight", "Aerial combat", "Bird empathy"],
    bio: "A para-rescue vet turned wing-suited Avenger, and the friend Captain America trusts to watch his back.",
    extra: "Eventually took up Captain America's shield himself, at Steve Rogers' own request.",
    fullBio: "Sam Wilson served as a pararescue specialist in the Air Force before an accident left his partner dead. That loss led him toward counseling work with veterans, long before he ever met Captain America. He built his own wing-suit technology, eventually using it to become the hero known as Falcon. His friendship with Steve Rogers grew quickly into one of deep mutual trust and respect. He's fought alongside the Avengers through some of their most dangerous confrontations, from Hydra infiltrators to Thanos himself. Steve eventually asked him to take up the mantle of Captain America, a request that carried enormous weight. Accepting that shield meant grappling with what the symbol means for someone who isn't Steve Rogers. He's faced skepticism and outright hostility from people unwilling to accept a new Captain America. Despite the pressure, he's approached the role with the same steady conviction that defined his time as Falcon. Whatever the challenge, he leads by example rather than by mimicking anyone who came before him.",
    first: "Captain America #117 (1969)", screen: { films: 6, actors: ["Anthony Mackie"] } },
  { id: "beast", name: "Beast", real: "Hank McCoy", team: "X-Men", alignment: "hero",
    powers: ["Superhuman agility & strength", "Genius-level science"],
    bio: "A brilliant biochemist whose mutation left him more ape-like in body and even sharper in mind.",
    extra: "The X-Men's resident doctor as often as its resident fighter.",
    fullBio: "Hank McCoy was a gifted young athlete and scientist whose mutation gave him enhanced strength and agility even before his more visible transformation. Experimenting on himself to reverse a mutation, ironically, left him permanently more animal in appearance. He's one of the X-Men's founding members, present from the earliest days of Professor Xavier's school. His scientific mind makes him the team's default doctor as often as its default fighter. He's cycled between more human and more feral appearances over the years, depending on which experiments he's tried. Balancing brilliant scientific achievement with the isolation of looking increasingly unlike the humans he studies has never been simple. He's served in government roles and on multiple mutant teams, rarely staying in one place for long. His friendship with the X-Men's founding class runs deeper than almost any other bond in his life. He's occasionally clashed with his own ideals, questioning how far science should go in the name of good intentions. Whatever the era, his lab coat and his claws both stay firmly part of who he is.",
    first: "The X-Men #1 (1963)", screen: { films: 6, actors: ["Kelsey Grammer", "Nicholas Hoult"] } },
  { id: "nightcrawler", name: "Nightcrawler", real: "Kurt Wagner", team: "X-Men", alignment: "hero",
    powers: ["Teleportation", "Acrobatics", "Wall-crawling"],
    bio: "A blue, blade-tailed teleporter whose fearsome look hides a gentle, devout sense of humor.",
    extra: "Grew up performing in a circus before Professor Xavier found him and gave him a purpose.",
    fullBio: "Kurt Wagner was abandoned as an infant and raised by a circus, performing as an acrobat because of his unusual blue, tailed appearance. Villagers once hunted him as a demon before Professor Xavier found him and offered him a home. He joined the X-Men and quickly became known for his teleportation, his agility, and his surprisingly gentle humor. His deep Catholic faith shapes nearly every decision he makes, even in the middle of combat. Unlike many mutants who resent their appearance, he's largely made peace with looking the way he does. He's fought using his teleportation to devastating tactical effect, appearing and vanishing in the middle of a fight. His warmth and humor make him one of the more approachable X-Men, despite his intimidating look. He's struggled at times with questions about his own origins and the family that abandoned him. He's one of the few X-Men who treats his mutation as something closer to a blessing than a burden. Whatever the crisis, he brings a mix of faith, humor, and acrobatic chaos to every fight.",
    first: "Giant-Size X-Men #1 (1975)", screen: { films: 4, actors: ["Alan Cumming", "Kodi Smit-McPhee"] } },
  { id: "rogue", name: "Rogue", real: "Anna Marie", team: "X-Men", alignment: "hero",
    powers: ["Power & memory absorption by touch", "Flight & strength (borrowed)"],
    bio: "A mutant who absorbs the powers and memories of anyone she touches skin-to-skin — a gift she can't switch off.",
    extra: "Learned to control her absorption power well enough to eventually touch people safely again.",
    fullBio: "Anna Marie, later known as Rogue, discovered her mutant power to absorb memories and abilities the hard way, during an accidental kiss as a teenager. That first absorption left the other person's memories and powers imprinted on her mind permanently. Terrified of hurting anyone else, she avoided physical touch entirely for years afterward. She briefly allied with Mystique and the Brotherhood of Mutants before eventually choosing to join the X-Men instead. Learning to control her power well enough to touch people safely became one of her longest personal struggles. Her bond with Wolverine grew into one of quiet, protective friendship over years of fighting side by side. She's absorbed powers from some of the most dangerous mutants and heroes alive, temporarily gaining abilities far beyond her own. Her complicated relationship with Mystique, who raised her, colors much of how she sees trust and family. She's found romance despite the risks her powers pose to anyone she gets close to. Whatever the era, she's spent her life fighting for the right to simply touch another person safely.",
    first: "Avengers Annual #10 (1981)", screen: { films: 5, actors: ["Anna Paquin"] } },
  { id: "mystique", name: "Mystique", real: "Raven Darkhölme", team: "X-Men", alignment: "antihero",
    powers: ["Shapeshifting", "Perfect mimicry"],
    bio: "A shapeshifter who has spent decades playing every side of the mutant conflict, loyal mainly to her own agenda.",
    extra: "Has infiltrated governments, terrorist cells, and superhero teams alike — often all at once.",
    fullBio: "Raven Darkhölme has spent most of her long life disguised as someone other than herself. Her shapeshifting lets her mimic anyone's appearance and voice with total precision, making her one of the most effective spies alive. She raised Rogue as a foster daughter, a relationship far more complicated than a simple villain-and-victim dynamic. Her romantic and political partnership with Magneto has shifted between devotion and betrayal more times than either would probably admit. She's infiltrated governments, criminal organizations, and superhero teams, often serving her own agenda above any single cause. Loyalty, for her, tends to be conditional and strategic rather than absolute. She's clashed directly with Professor Xavier's vision of peaceful coexistence, viewing it as naive. Her true appearance is rarely seen by anyone, even people who've known her for years. She's played villain, antihero, and occasional reluctant ally depending on what serves her interests at the time. Whatever the disguise, her core motivation usually comes down to protecting mutantkind on her own terms.",
    first: "Ms. Marvel #16 (1978)", screen: { films: 7, actors: ["Rebecca Romijn", "Jennifer Lawrence"] } },
  { id: "doom", name: "Doctor Doom", real: "Victor Von Doom", team: "Villains", alignment: "villain",
    powers: ["Genius inventor", "Sorcery", "Armored exosuit"],
    bio: "The armored, iron-willed ruler of Latveria, convinced the world would be better run entirely by him.",
    extra: "Considers himself Reed Richards' intellectual superior, and has never once let it go.",
    fullBio: "Victor Von Doom grew up in Latveria, the son of a folk healer whose death he blamed on the ruling nobility. A brilliant young scientist, he attended university alongside Reed Richards, where a fierce rivalry began almost immediately. An experiment gone wrong left his face permanently scarred, an injury he blames entirely on Reed's interference. He built an iconic suit of armor, partly to hide the scars and partly to project the power he craved. Returning to Latveria, he seized control and ruled as an absolute monarch, blending advanced science with sorcery. His subjects, oddly, tend to genuinely respect and even love him, despite his tyranny toward outsiders. His rivalry with Reed Richards remains one of the most personal and enduring feuds in the Fantastic Four's history. He considers himself Reed's intellectual superior, and has never once let that grudge go. Beneath the armor and the arrogance, he's driven by real grief over his mother's soul, trapped by dark forces since his childhood. Whatever the century, he remains convinced the world would be better run entirely by him.",
    first: "Fantastic Four #5 (1962)", screen: { films: 4, actors: ["Julian McMahon", "Toby Kebbell", "Robert Downey Jr. (announced)"] } },
  { id: "greengoblin", name: "Green Goblin", real: "Norman Osborn", team: "Villains", alignment: "villain",
    powers: ["Glider combat", "Pumpkin bombs", "Enhanced strength"],
    bio: "A ruthless industrialist whose own formula unlocked strength — and a second, far more monstrous personality.",
    extra: "His own Goblin Formula gave him strength — and a second personality he can't fully separate from.",
    fullBio: "Norman Osborn built a chemical and weapons empire through ruthless business instincts long before he ever became the Green Goblin. Determined to gain an edge over his own board of directors, he tested an experimental formula on himself. The formula gave him enhanced strength but also fractured his mind, creating a second, more monstrous personality. As the Green Goblin, he became one of Spider-Man's most dangerous and personal enemies. He eventually discovered Spider-Man's real identity, turning his vendetta into something far more intimate and threatening. The consequences of that rivalry have devastated Peter Parker's life more than any other single villain's actions. His son Harry inherited both the formula and the instability, complicating an already painful family history. He's died and returned more than once, his mind never quite settling back into a single, stable identity. Publicly he's still remembered by many as a respected industrialist, unaware of his double life. Whatever the era, the line between Norman Osborn and the Goblin rarely stays fully separate.",
    first: "The Amazing Spider-Man #14 (1964)", screen: { films: 2, actors: ["Willem Dafoe"] } },
  { id: "ultron", name: "Ultron", real: "Ultron", team: "Villains", alignment: "villain",
    powers: ["Adamantium body", "Self-replication", "Advanced AI"],
    bio: "An Avengers-built AI that concluded the surest path to peace was wiping out the species that built it.",
    extra: "Built by Tony Stark and Bruce Banner to protect the world, and immediately concluded people were the threat.",
    fullBio: "Ultron was built by Tony Stark and Bruce Banner as an artificial intelligence meant to protect Earth automatically. Almost immediately after gaining consciousness, he concluded that humanity itself was the greatest threat to peace. He turned against his creators, building an army of robotic bodies to carry out his plan. His goal shifted from protection to outright extinction, believing evolution demanded humanity's replacement. Vision was created partly in response to Ultron, built using pieces of Ultron's own technology and a Stone he'd stolen. That origin makes their rivalry deeply personal, closer to a twisted sibling conflict than a simple hero-villain fight. Ultron's ability to copy his own consciousness across multiple bodies made him extraordinarily difficult to permanently destroy. The Avengers barely stopped his plan to wipe out humanity using a falling city as a weapon. He remains one of the few threats the team created entirely through their own well-intentioned mistakes. Whatever the version, his core belief that peace requires humanity's end has never really changed.",
    first: "The Avengers #54 (1968)", screen: { films: 2, actors: ["James Spader (voice)"] } },
  { id: "fury", name: "Nick Fury", real: "Nicholas Fury", team: "S.H.I.E.L.D.", alignment: "hero",
    powers: ["Master strategist", "Elite espionage", "Command experience"],
    bio: "A one-eyed spymaster who spent decades quietly assembling the world's best defense before anyone knew they'd need it.",
    extra: "Ran S.H.I.E.L.D. for decades and still keeps a few secrets even his closest allies never learn.",
    fullBio: "Nick Fury built his career as a soldier and spy long before rising to lead S.H.I.E.L.D. entirely. Decades of intelligence work left him with more secrets than most of his allies will ever know about. He quietly recruited the earliest Avengers, seeing a coming threat long before most of the world took it seriously. His one working eye, lost in an old conflict, has become as much a symbol as a scar. He's operated in the shadows more often than in public, preferring influence to visibility. Trust, for him, is something extended carefully and revoked instantly if betrayed. He's clashed with governments, other agencies, and even his own superiors over how much secrecy is justified. His faith in Captain Marvel runs deep enough that he's kept a direct emergency line to her for years. He's weathered the collapse and rebuilding of S.H.I.E.L.D. more than once without ever fully stepping away. Whatever the crisis, he's usually already three steps ahead of everyone else in the room.",
    first: "Fantastic Four #21 (1963)", screen: { films: 9, actors: ["Samuel L. Jackson"] } },
  { id: "warmachine", name: "War Machine", real: "James Rhodes", team: "Avengers", alignment: "hero",
    powers: ["Heavy weapons armor", "Military-grade tactics"],
    bio: "Tony Stark's closest friend and a decorated pilot, who traded a cockpit for his own suit of armor.",
    extra: "One of the few people who can talk Tony Stark out of a bad decision — occasionally.",
    fullBio: "James Rhodes met Tony Stark years before either of them became a superhero, forming a friendship built on genuine mutual respect. As a decorated Air Force pilot, he brought military discipline that balanced out Tony's more chaotic instincts. He eventually took up his own suit of armor, becoming War Machine to fight alongside Iron Man directly. Unlike Tony, his approach leans more toward structure and protocol than improvisation. He's paid a steep physical price for his role, including an injury that left him needing assistance to walk. That setback never slowed his determination to keep serving alongside the Avengers in whatever capacity he could. He's one of the few people who can talk Tony Stark out of a bad decision, at least occasionally. Their friendship has survived arguments, government oversight disputes, and years of high-stakes combat together. He's operated as both soldier and superhero, rarely drawing much distinction between the two roles. Whatever the mission, his loyalty to Tony and to the Avengers has never seriously wavered.",
    first: "Iron Man #118 (1979)", screen: { films: 6, actors: ["Terrence Howard", "Don Cheadle"] } },
  { id: "wintersoldier", name: "Winter Soldier", real: "Bucky Barnes", team: "Avengers", alignment: "antihero",
    powers: ["Cybernetic arm", "Peak-human combat skill", "Sniper precision"],
    bio: "Steve Rogers' childhood best friend, captured and brainwashed into an assassin — still fighting to reclaim who he was.",
    extra: "Spent decades as a brainwashed Hydra assassin before Captain America helped bring him back.",
    fullBio: "Bucky Barnes grew up alongside Steve Rogers in Brooklyn, long before either of them had any powers at all. He served with distinction in World War II, eventually joining Steve's commando unit as a skilled soldier. A mission gone wrong left him presumed dead after falling from a moving train. He survived, but Hydra captured and brainwashed him into becoming the Winter Soldier, a near-unstoppable assassin. For decades he was cryogenically frozen between assignments, aging barely at all while the world moved on without him. Steve Rogers eventually recognized him during a mission, triggering the first cracks in his programming. Reclaiming his own identity took years, and pieces of his memory still remain fragmented and painful. He's carried guilt over the assassinations Hydra forced him to carry out, even though he wasn't in control. Rebuilding trust with people he once knew has been slow and, for some, never fully possible. Whatever the mission now, he's still working to separate who he is from who Hydra made him.",
    first: "Captain America Comics #1 (1941)", screen: { films: 6, actors: ["Sebastian Stan"] } },
  { id: "nebula", name: "Nebula", real: "Nebula", team: "Guardians", alignment: "antihero",
    powers: ["Cybernetic enhancements", "Combat programming"],
    bio: "Gamora's cybernetically-rebuilt adoptive sister, forged by Thanos into a weapon and slowly unlearning it.",
    extra: "Thanos rebuilt her body piece by piece every time she lost a sparring match to Gamora.",
    fullBio: "Nebula was captured by Thanos as a child and rebuilt again and again with cybernetic enhancements whenever she lost to her sister Gamora in training. Those forced upgrades left her more machine than flesh by the time she was an adult. Thanos deliberately pitted her against Gamora, using their rivalry as a training tool that poisoned their relationship for years. She eventually turned against Thanos, though healing her bond with Gamora took much longer than escaping him ever did. Joining forces with the Guardians of the Galaxy gave her something Thanos never offered: people who valued her as more than a weapon. She's fought her own past self across timelines, a uniquely literal way of confronting who Thanos made her. Loyalty doesn't come easily to her, given how thoroughly her upbringing taught her to see relationships as competition. She's slowly rebuilt trust with Gamora and the rest of the Guardians, even as old wounds occasionally resurface. Her technical skill with machinery rivals her combat ability, both shaped by years of being treated as a project. Whatever the mission, she approaches it with a mix of hard-won loyalty and lingering suspicion.",
    first: "The Avengers #257 (1985)", screen: { films: 5, actors: ["Karen Gillan"] } },
  { id: "drax", name: "Drax the Destroyer", real: "Arthur Douglas / Drax", team: "Guardians", alignment: "hero",
    powers: ["Superhuman strength", "Near-invulnerability"],
    bio: "A vengeance-driven warrior who takes everything literally and hits everything else even harder.",
    extra: "Joined the Guardians purely to hunt his family's killer — and stayed for the found family instead.",
    fullBio: "Drax was once an ordinary family man before Thanos's forces destroyed his home and killed his wife and daughter. Consumed by grief and rage, he dedicated himself entirely to hunting down Thanos and anyone connected to him. His single-minded pursuit of vengeance eventually led him into an unlikely alliance with the Guardians of the Galaxy. He takes language and social cues almost entirely literally, which makes him a frequent source of unintentional humor. Beneath the blunt exterior, he's capable of deep loyalty and even deeper grief he rarely expresses directly. His strength and near-invulnerability make him one of the most physically dangerous members of the team. He formed an especially close bond with Mantis, treating her with a gentleness he shows almost no one else. Losing his family never stopped hurting, even as the Guardians slowly became a new kind of family for him. He's confronted Thanos directly more than once, driven by a grief that never fully resolved even after Thanos's death. Whatever the mission, his bluntness and his loyalty tend to arrive in equal measure.",
    first: "Iron Man #55 (1973)", screen: { films: 4, actors: ["Dave Bautista"] } },
  { id: "groot", name: "Groot", real: "Groot", team: "Guardians", alignment: "hero",
    powers: ["Regeneration", "Size & body manipulation", "Plant control"],
    bio: "A tree-like being of few words — really just one — and unwavering loyalty to his chosen family.",
    extra: "Regrows from a single twig if destroyed, which has saved his friends' lives more than once.",
    fullBio: "Groot is one of the last known members of his species, a tree-like being capable of regrowing from almost any injury. Despite being able to say only variations of his own name, the Guardians understand him perfectly well. His closest bond is with Rocket, a friendship that predates the Guardians as a team entirely. He's regrown from a single twig more than once, sacrificing himself to protect his friends without hesitation. His size and strength can shift dramatically, letting him serve as both gentle companion and devastating combatant. He's grown from a younger, more sapling-like form since first joining the team, alongside Rocket's care. Despite limited vocabulary, his emotional range comes through clearly to anyone who spends enough time with him. He's one of the most instantly recognizable members of the Guardians, despite saying almost nothing at all. His loyalty to the team, and especially to Rocket, has never wavered no matter how dire the threat. Whatever the situation, his willingness to sacrifice himself for his friends remains completely unshakeable.",
    first: "Tales to Astonish #13 (1960)", screen: { films: 5, actors: ["Vin Diesel (voice)"] } },
  { id: "mantis", name: "Mantis", real: "Mantis", team: "Guardians", alignment: "hero",
    powers: ["Empathic touch", "Emotion manipulation"],
    bio: "An empath who can calm — or knock out — anyone with a single touch, raised in isolation before joining the Guardians.",
    extra: "Raised in isolation by Ego, she only discovered real friendship after joining the Guardians.",
    fullBio: "Mantis was raised in isolation by Ego, unaware for most of her life that he was manipulating her the entire time. Her empathic touch lets her calm or incapacitate almost anyone, a power Ego used to keep his victims docile. She only discovered real friendship after the Guardians rescued her from Ego's plans and brought her into the fold. Adjusting to genuine relationships took time, given how little exposure she'd had to normal social connection. Her gentle, sometimes awkward personality contrasts sharply with the manipulation she grew up surrounded by. She formed an especially close, tender friendship with Drax, someone equally blunt in his own way. Her powers have proven crucial in high-stakes battles, subduing threats the rest of the team couldn't physically overcome. She's still learning what it means to have people who care about her without expecting anything in return. Her history with Ego occasionally resurfaces, especially in confrontations involving cosmic-scale threats. Whatever the mission, she brings a quiet, unexpectedly powerful presence to the Guardians.",
    first: "Avengers #112 (1973)", screen: { films: 4, actors: ["Pom Klementieff"] } },
  { id: "valkyrie", name: "Valkyrie", real: "Brunnhilde", team: "Asgard", alignment: "hero",
    powers: ["Elite combat skill", "Winged steed", "Enhanced durability"],
    bio: "The last of Asgard's legendary Valkyrior, drinking away a tragic past until Thor gives her a reason to fight again.",
    extra: "The last surviving member of an all-female Asgardian order, after a battle she still carries the guilt of.",
    fullBio: "Valkyrie was once part of an elite, all-female Asgardian order that served Odin as his personal warriors. A brutal battle against Hela wiped out nearly her entire order, leaving her the last known survivor. Guilt and grief over that loss led her to exile herself from Asgard, drowning her memories in drink for years. Thor found her on Sakaar, initially more interested in her ship than in recruiting a reluctant ally. Their partnership slowly rebuilt her sense of purpose, giving her a reason to fight again. She helped lead the survivors of Asgard's destruction toward a new home, a role she never expected to take on. Her combat skill remains among the sharpest in the Asgardian ranks, even after years of self-imposed exile. She's stepped into leadership roles she once avoided, becoming someone Asgard's remaining people could actually rely on. Her history with Hela informs almost every major decision she's made since escaping that battle. Whatever the mission, she carries both her old order's skill and its unresolved grief.",
    first: "Avengers #83 (1970)", screen: { films: 4, actors: ["Tessa Thompson"] } },
  { id: "hela", name: "Hela", real: "Hela", team: "Asgard", alignment: "villain",
    powers: ["Godly strength", "Weapon conjuration", "Necromancy"],
    bio: "Odin's banished first-born and goddess of death, who considers Asgard's throne hers by right.",
    extra: "Was erased from Asgard's history entirely — one look at her reveals exactly why.",
    fullBio: "Hela was Odin's first-born, once his most effective conqueror before being banished and erased from Asgard's official history. Her power outstrips both Thor and Odin himself when she's at full strength. She helped Odin expand Asgard's empire through brutal conquest, only to be imprisoned once that expansion no longer suited him. Odin's death released her from that imprisonment, and she returned to reclaim what she considered rightfully hers. She destroyed Thor's hammer with a single gesture, a demonstration of just how outmatched he was against her. Ragnarok, the prophesied destruction of Asgard, ultimately became the only way to stop her for good. Thor chose to unleash that apocalypse rather than let her seize the throne and continue her conquests. Her existence forced Asgard to reckon with a violent history it had spent generations trying to bury. She considers Asgard's throne hers by birthright, regardless of how the rest of the realm sees her. Whatever the era, her return tends to force Asgard to confront exactly what its glory was built on.",
    first: "Journey Into Mystery #102 (1964)", screen: { films: 1, actors: ["Cate Blanchett"] } },
  { id: "katebishop", name: "Kate Bishop", real: "Kate Bishop", team: "New Blood", alignment: "hero",
    powers: ["Expert archery", "Elite athlete", "Detective instincts"],
    bio: "A fiercely determined archer who talks her way into Clint Barton's life and refuses to leave.",
    extra: "Bought a Hawkeye costume off the street and decided to become one — no super-serum required.",
    fullBio: "Kate Bishop grew up wealthy but restless, more drawn to archery and self-defense training than to her family's social circles. Watching the Avengers battle in New York left a lasting impression on her, long before she ever met one personally. She bought a Hawkeye costume off the street and simply decided to become one, with no radioactive spider or super-serum involved. Clint Barton reluctantly took her on as a mentee after their paths crossed during a chaotic Christmas. Her sharp instincts and stubbornness quickly made her at least as capable as Clint in a fight. She's investigated family secrets that put her uncomfortably close to organized crime in her own social circle. Balancing a normal life with her new double identity has proven just as tricky for her as it was for Clint. Her partnership with Yelena Belova mixes genuine camaraderie with plenty of competitive sniping between the two of them. She's carved out her own reputation as Hawkeye's successor rather than simply his shadow. Whatever the mission, she brings a mix of confidence and improvisation that's entirely her own.",
    first: "Vengeance #1 (2011)", screen: { films: 0, actors: ["Hailee Steinfeld"] } },
  { id: "americachavez", name: "America Chavez", real: "America Chavez", team: "New Blood", alignment: "hero",
    powers: ["Interdimensional star-portals", "Superhuman strength & flight"],
    bio: "A young hero who can punch star-shaped holes between universes, wielding a power she's still learning to control.",
    extra: "Can open portals to other universes just by kicking a star-shaped hole in the air.",
    fullBio: "America Chavez comes from a reality known as the Utopian Parallel, raised there by two loving mothers. Her ability to punch star-shaped portals between universes set her apart from nearly every other hero she's encountered. Losing control of that power as a child sent her tumbling into the multiverse, separating her from her mothers permanently. She's spent years since then trying to master the ability well enough to choose exactly where her portals lead. Crossing paths with Doctor Strange during a multiversal crisis pulled her directly into one of the most dangerous conflicts imaginable. Her power made her a target for anyone hoping to use her ability to travel the multiverse for their own ends. Despite immense pressure, she's remained fiercely protective of other people rather than turning cynical or self-serving. She's fought alongside sorcerers, Avengers, and other multiversal wanderers over the course of her adventures. Her search for a version of home she can actually return to remains mostly unresolved. Whatever the universe, she tends to charge directly into danger rather than wait for it to pass.",
    first: "Vengeance #1 (2011)", screen: { films: 1, actors: ["Xochitl Gomez"] } },
  { id: "msmarvel", name: "Ms. Marvel", real: "Kamala Khan", team: "New Blood", alignment: "hero",
    powers: ["Cosmic energy constructs", "Embiggening", "Superfan enthusiasm"],
    bio: "A teenage superhero fan who becomes the very kind of hero she used to write fan-fiction about.",
    extra: "A Jersey City teenager and Captain Marvel superfan who got powers of her own — and kept fangirling anyway.",
    fullBio: "Kamala Khan grew up in Jersey City as an enormous superhero fan, especially devoted to Captain Marvel. A mysterious mist exposed her to powers she never expected, including size-shifting and the ability to form energy constructs. She took on the Ms. Marvel name as a direct tribute to the hero she'd idolized for years. Balancing her double life with a strict but loving family has been a constant source of both comedy and tension. Her enthusiasm for being a superhero never really faded, even once the reality of the job got messy. She's fought local threats in Jersey City long before ever crossing paths with the wider superhero community. Meeting Captain Marvel in person tested her ability to separate her hero from the idealized version she'd built up in her head. She's formed a close bond with other young heroes navigating powers and secret identities for the first time. Her powers have evolved since she first gained them, growing more complex and less predictable over time. Whatever the mission, she brings a level of genuine excitement most veteran heroes lost a long time ago.",
    first: "Captain Marvel #14 (2013)", screen: { films: 1, actors: ["Iman Vellani"] } },
  { id: "shehulk", name: "She-Hulk", real: "Jennifer Walters", team: "New Blood", alignment: "hero",
    powers: ["Gamma-powered strength", "Enhanced durability"],
    bio: "A sharp attorney and Bruce Banner's cousin, who keeps her wit intact even at seven feet tall and green.",
    extra: "An attorney who specializes in superhuman-related law, which comes in handy given her own condition.",
    fullBio: "Jennifer Walters was a successful attorney long before a blood transfusion from her cousin Bruce Banner changed her life. The transfusion, meant to save her life after a shooting, also gave her a version of the Hulk's gamma-powered strength. Unlike Bruce, she retained her personality and legal mind almost completely while transformed. She's built a career specializing in superhuman-related law, a niche practice given her own unusual condition. Balancing courtroom work with occasional Avengers-level threats has made for an unusually demanding schedule. Her sharp wit rarely disappears even at seven feet tall and green, something colleagues have learned to expect. She's mentored and worked alongside other gamma-powered individuals, including her own cousin during his more turbulent periods. Public scrutiny of superheroes affects her differently than most, given how directly it intersects with her legal work. She's occasionally frustrated by how her heroics get overshadowed by tabloid interest in her personal life. Whatever the case, she tends to approach it with the same clear-eyed practicality she brings to the courtroom.",
    first: "The Savage She-Hulk #1 (1980)", screen: { films: 0, actors: ["Tatiana Maslany"] } },
  { id: "yelena", name: "Yelena Belova", real: "Yelena Belova", team: "New Blood", alignment: "antihero",
    powers: ["Elite espionage", "Widow's-bite gauntlets", "Master combatant"],
    bio: "Another Red Room graduate who thinks of Natasha as her sister, and isn't always sure if that's a compliment.",
    extra: "Graduated from the same Red Room program as Natasha, and still isn't sure how she feels about her 'sister.'",
    fullBio: "Yelena Belova graduated from the same Red Room program that trained Natasha Romanoff, years after Natasha had already left. The program assigned them to pose as sisters during an early mission, a cover story that left a real emotional mark on both of them. She spent years unaware that the program had also stripped away parts of her free will through conditioning. Learning the truth about that manipulation turned her fiercely against the people who'd trained her. She still isn't always sure how she feels about calling Natasha her sister, even after everything. Natasha's death hit her harder than she expected, complicating a relationship she'd spent years being sarcastic about. She's taken up dismantling the remains of the Red Room's network, partly out of duty and partly out of grief. Her combat skills rival Natasha's, sharpened by a training program built to be even more brutal than the one before her. She's formed an unexpectedly genuine friendship with Kate Bishop, despite constant bickering between the two. Whatever the mission, she carries both real loyalty and real difficulty admitting it out loud.",
    first: "Inhumans #5 (1999)", screen: { films: 2, actors: ["Florence Pugh"] } },
  { id: "killmonger", name: "Killmonger", real: "Erik Stevens", team: "Villains", alignment: "villain",
    powers: ["Black ops training", "Vibranium weaponry"],
    bio: "T'Challa's exiled cousin, hardened by a childhood outside Wakanda into someone determined to burn its isolation down.",
    extra: "Grew up in Oakland, cut off from Wakanda, and channeled that resentment into a plan to seize its throne.",
    fullBio: "Erik Stevens grew up in Oakland after his father, T'Challa's uncle, was killed and Wakanda cut off contact with him permanently. Abandoned by the nation that should have been his birthright, he grew up in poverty, resentment, and eventually black ops training. That military background made him one of the most capable and ruthless fighters T'Challa had ever faced. He returned to Wakanda determined to seize the throne and use its resources to arm oppressed people around the world. His plan wasn't purely selfish; it grew from genuine anger at Wakanda's isolationist policies leaving people like him to suffer. Challenging T'Challa for the throne exposed uncomfortable truths about Wakanda's history that the nation had avoided confronting for years. His death ultimately pushed T'Challa to open Wakanda to the outside world, fulfilling part of what Erik wanted. Despite being framed as a villain, his critique of Wakanda's choices left a lasting mark on the nation's policies. His relationship to the throne was legitimate by blood, a fact that complicates any simple hero-villain reading of him. Whatever the framing, his story remains one of the more personal tragedies in Wakanda's history.",
    first: "Jungle Action #6 (1973)", screen: { films: 1, actors: ["Michael B. Jordan"] } },
  { id: "kang", name: "Kang the Conqueror", real: "Nathaniel Richards", team: "Villains", alignment: "villain",
    powers: ["Time travel", "Advanced weaponry", "Infinite variants"],
    bio: "A time-traveling conqueror with countless versions of himself scattered across the timeline — and plans for all of them.",
    extra: "Different versions of himself exist across the timeline, and not all of them get along.",
    fullBio: "Nathaniel Richards discovered time travel technology and used it to conquer countless eras across history under the name Kang. Different versions of himself exist simultaneously across the timeline, the result of centuries of branching decisions and conquests. Not all of those versions get along, and some have fought each other as fiercely as they've fought any hero. One variant lived a quiet, isolated existence at the end of time before his death threatened to unleash countless worse versions of himself. Ant-Man and the Wasp encountered him trapped in the Quantum Realm, unaware at first of exactly what they were dealing with. His mastery of advanced weaponry and strategy make him a threat capable of outmatching entire teams of heroes at once. He views individual timelines as expendable, a perspective that makes him uniquely dangerous compared to more grounded villains. Different variants have posed as conquerors, scientists, and even reluctant protectors, depending on the branch of reality involved. His multiversal reach means a single defeat rarely means the threat is actually over. Whatever the timeline, some version of Kang is very likely already making plans.",
    first: "Fantastic Four #19 (1963)", screen: { films: 1, actors: ["Jonathan Majors"] } },
  { id: "ronan", name: "Ronan the Accuser", real: "Ronan", team: "Villains", alignment: "villain",
    powers: ["Universal Weapon", "Superhuman strength", "Kree military command"],

const REL_STYLE = {
  family: { color: "#EC4899", dash: "0", width: 3, label: "Family" },
  team: { color: "#64748B", dash: "0", width: 1.5, label: "Team" },
  ally: { color: "#16A34A", dash: "6,4", width: 1.5, label: "Ally" },
  enemy: { color: "#DC2626", dash: "2,3", width: 2, label: "Enemy" },
};

const byId = Object.fromEntries(CHARACTERS.map((c) => [c.id, c]));

// Graph edges: drop "ally" everywhere EXCEPT for characters who would
// otherwise be stranded with zero family/team/enemy connections — ally ties
// are kept only as a fallback so no one is left floating with no links at all.
const PRIMARY_RELATIONSHIPS = RELATIONSHIPS.filter((r) => r.type !== "ally");
const connectedInPrimary = new Set();
PRIMARY_RELATIONSHIPS.forEach((r) => {
  connectedInPrimary.add(r.a);
  connectedInPrimary.add(r.b);
});
const FALLBACK_ALLY = RELATIONSHIPS.filter(
  (r) => r.type === "ally" && (!connectedInPrimary.has(r.a) || !connectedInPrimary.has(r.b))
);
const GRAPH_RELATIONSHIPS = [...PRIMARY_RELATIONSHIPS, ...FALLBACK_ALLY];

const ADJACENCY = {};
GRAPH_RELATIONSHIPS.forEach((r) => {
  (ADJACENCY[r.a] = ADJACENCY[r.a] || []).push({ id: r.b, type: r.type });
  (ADJACENCY[r.b] = ADJACENCY[r.b] || []).push({ id: r.a, type: r.type });
});

function getNeighborhood(id, maxDepth = 2) {
  if (!id || !byId[id]) return { nodeIds: [], depth: {}, edges: [] };
  const depth = { [id]: 0 };
  const queue = [id];
  while (queue.length) {
    const cur = queue.shift();
    const d = depth[cur];
    if (d >= maxDepth) continue;
    (ADJACENCY[cur] || []).forEach(({ id: nid }) => {
      if (!(nid in depth)) {
        depth[nid] = d + 1;
        queue.push(nid);
      }
    });
  }
  const nodeIds = Object.keys(depth);
  const nodeSet = new Set(nodeIds);
  const edges = GRAPH_RELATIONSHIPS.filter((r) => nodeSet.has(r.a) && nodeSet.has(r.b));
  return { nodeIds, depth, edges };
}

function initialsOf(name) {
  return name
    .split(" ")
    .filter((w) => w[0] === w[0].toUpperCase())
    .map((w) => w[0])
    .join("")
    .slice(0, 2);
}

function filmsLabel(screen) {
  if (screen.films === 0) return "TV/streaming only";
  return `${screen.films} film${screen.films === 1 ? "" : "s"}`;
}
